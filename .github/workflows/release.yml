name: Publish plugin release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          python -m pip install packaging
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify the release version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.version import Version

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"The release tag must be v{version}")

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              metadata_file, = (p for p in archive.namelist() if p.endswith(".dist-info/METADATA"))
              metadata = BytesParser().parsebytes(archive.read(metadata_file))
          if Version(metadata["Version"]) != Version(version):
              raise SystemExit("Wheel and project versions differ")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(Version(version).is_prerelease).lower()}", file=output)
          PY

      - name: Publish the wheel on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --verify-tag --title "Visual Explorer $GITHUB_REF_NAME" \
            --prerelease="$PRERELEASE" --generate-notes
