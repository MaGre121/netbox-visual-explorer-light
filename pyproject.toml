[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-visual-explorer"
authors = [{ name = "Matthias Grebe" }]
version = "0.3.6b"
description = "Interaktive Netzpläne für NetBox"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/MaGre121/netbox-visual-explorer-light"
Repository = "https://github.com/MaGre121/netbox-visual-explorer-light"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["netbox_visual_explorer*"]
namespaces = false

[tool.setuptools.package-data]
netbox_visual_explorer = ["templates/netbox_visual_explorer/*.html", "static/netbox_visual_explorer/*.js", "static/netbox_visual_explorer/*.css", "static/netbox_visual_explorer/vendor/*"]
