[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-visual-explorer"
version = "0.3.0"
description = "Interaktive Netzpläne für NetBox"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["netbox_visual_explorer*"]
namespaces = false

[tool.setuptools.package-data]
netbox_visual_explorer = ["templates/netbox_visual_explorer/*.html", "static/netbox_visual_explorer/*.js", "static/netbox_visual_explorer/*.css", "static/netbox_visual_explorer/vendor/*"]
